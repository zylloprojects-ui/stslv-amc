# STSLV AMC — keep the systemd journal bounded. TEMPLATE.
# Install as /etc/systemd/journald.conf.d/stslv-journald.conf, then: systemctl restart systemd-journald
# The API, backup jobs and monitor log here (journalctl -u <unit>). None of them logs a credential.

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
SystemKeepFree=2G
MaxRetentionSec=90day
