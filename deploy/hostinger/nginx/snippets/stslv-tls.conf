# STSLV AMC — TLS settings. TEMPLATE. Install as /etc/nginx/snippets/stslv-tls.conf.
# Mozilla "intermediate" profile: TLS 1.2 and 1.3, modern ciphers, no session tickets.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:STSLVSSL:10m;
ssl_session_tickets off;

# No OCSP stapling: Let's Encrypt certificates no longer carry an OCSP responder address (OCSP was retired
# in 2025), so stapling would only log warnings. Revisit if a different certificate authority is used.
