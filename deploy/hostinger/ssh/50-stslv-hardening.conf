# STSLV AMC — OpenSSH server hardening. TEMPLATE: NOT YET APPLIED.
# Install as /etc/ssh/sshd_config.d/50-stslv-hardening.conf.
#
# DANGER: applying this before a working SSH key login is confirmed for the deployment user locks
# everyone out. Follow docs/HOSTINGER_VPS.md "SSH" in order, keep the existing session open, test a NEW
# session, and keep Hostinger's browser console (hPanel) available as the way back in.
#
# Replace __DEPLOY_USER__ with the confirmed non-root administrator account (for example "stslvadmin").
# The application service users (stslv, stslv-backup, stslv-monitor) have no shell and no SSH access.

# Keys only. Passwords and keyboard-interactive logins are refused.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# No direct root login; administrators use sudo from their own account.
PermitRootLogin no
AllowUsers __DEPLOY_USER__

# Fewer guesses per connection, short login window.
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60

# No forwarding the application does not need.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no

# Drop dead sessions.
ClientAliveInterval 300
ClientAliveCountMax 2

LogLevel VERBOSE
