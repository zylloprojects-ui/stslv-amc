# fail2ban jails for the STSLV AMC VPS. Installed as /etc/fail2ban/jail.d/stslv.local (root 0644).
# Kept in the repository as stslv-jail.conf because the root .gitignore ignores *.local files.
# Added at the final integration (2026-11-09): docs/HOSTINGER_VPS.md step 14 installs this file, which the P0
# templates referenced but did not contain. Template only: nothing has been applied to any server.
#
# Uses fail2ban's stock filters only (sshd, nginx-limit-req). The application's own sign-in limits stay the
# first line of defence (LOGIN_RATE_LIMIT, LOGIN_FAILURE_LIMIT); this jail stops repeated offenders earlier.
# Before enabling, add the administrators' fixed addresses to ignoreip so a mistake never locks them out.

[DEFAULT]
# Local addresses are never banned. Add the office / administrator addresses after confirming them.
ignoreip = 127.0.0.1/8 ::1
backend  = systemd
banaction = ufw
bantime  = 1h
findtime = 10m
maxretry = 5

[sshd]
enabled  = true
port     = ssh
# SSH accepts keys only (ssh/50-stslv-hardening.conf); repeated failures are scanners.
maxretry = 4
bantime  = 24h

[nginx-limit-req]
# Clients that keep hitting Nginx's request limits (stslv_auth on sign-in, stslv_api on the API) after being
# answered 429. Reads the site's own error log (nginx/stslv-amc.conf).
enabled  = true
backend  = auto
port     = http,https
logpath  = /var/log/nginx/stslv-amc.error.log
findtime = 10m
maxretry = 10
bantime  = 1h
