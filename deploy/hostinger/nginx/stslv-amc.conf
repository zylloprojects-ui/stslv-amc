# STSLV AMC — Nginx site for the Hostinger VPS. TEMPLATE: NOT YET DEPLOYED.
#
# Install as /etc/nginx/sites-available/stslv-amc.conf and link it into sites-enabled.
# Replace every placeholder before use (see deploy/hostinger/README.md):
#   __APP_DOMAIN__     the confirmed public host name of the application (one name, no scheme)
# and check the CSP hash in snippets/stslv-security-headers.conf against the release (scripts/csp-hash.sh).
#
# Layout on the server:
#   /var/www/stslv-amc/web/current   built web application (stslv-web/dist), a symlink to a release folder
#   127.0.0.1:3001                   the Node.js API (systemd unit stslv-amc-api), never exposed directly
#   /var/www/letsencrypt             ACME HTTP-01 challenge folder for certbot --webroot
#
# The browser loads the web application and calls /api on the SAME origin, so the web build is made
# with VITE_API_BASE_URL empty and the API's CORS_ORIGIN is https://__APP_DOMAIN__.

# Coarse, per-address limits in front of the API's own limits (which stay in force).
limit_req_zone $binary_remote_addr zone=stslv_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=stslv_api:10m  rate=20r/s;
limit_req_status 429;

upstream stslv_amc_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

# ---------------------------------------------------------------------------------------------
# Port 80: only the ACME challenge and a redirect to HTTPS.
# ---------------------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __APP_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Any other host name (an IP address, a stray DNS record) gets nothing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Self-signed placeholder so the TLS handshake can be refused cleanly; see README.
    ssl_certificate     /etc/nginx/ssl/default-reject.crt;
    ssl_certificate_key /etc/nginx/ssl/default-reject.key;
    return 444;
}

# ---------------------------------------------------------------------------------------------
# The application.
# ---------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __APP_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__APP_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__APP_DOMAIN__/privkey.pem;
    include /etc/nginx/snippets/stslv-tls.conf;

    server_tokens off;
    charset utf-8;

    access_log /var/log/nginx/stslv-amc.access.log;
    error_log  /var/log/nginx/stslv-amc.error.log warn;

    # Add AMC Contract sends its contract document inside a JSON body: ATTACHMENT_MAX_MB (12) x 1.34 + 1 MB,
    # rounded up. Raise together with ATTACHMENT_MAX_MB, never independently.
    client_max_body_size 20m;
    client_body_timeout 60s;

    root /var/www/stslv-amc/web/current;
    index index.html;

    # -- API -----------------------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=stslv_auth burst=20 nodelay;
        include /etc/nginx/snippets/stslv-api-proxy.conf;
    }

    location /api/ {
        limit_req zone=stslv_api burst=60 nodelay;
        include /etc/nginx/snippets/stslv-api-proxy.conf;
    }

    # -- Web application -----------------------------------------------------------------------
    # Hashed build files never change: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/stslv-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always be fetched fresh so a new release is picked up at once.
    location = /index.html {
        include /etc/nginx/snippets/stslv-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Single-page application: any path that is not a file is answered with index.html.
    location / {
        include /etc/nginx/snippets/stslv-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or source maps from the web root.
    location ~ /\. { deny all; return 404; }
    location ~* \.map$ { deny all; return 404; }
}
