# STSLV AMC — reverse proxy to the Node.js API. TEMPLATE.
# Install as /etc/nginx/snippets/stslv-api-proxy.conf.
#
# The API itself sets X-Content-Type-Options, X-Frame-Options, Referrer-Policy and (NODE_ENV=production)
# Strict-Transport-Security on every response (stslv-api/src/app.ts), so only what it lacks is added here.

proxy_pass http://stslv_amc_api;
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
# Replaced, never appended: the API trusts exactly one proxy (TRUST_PROXY=1), this one, so a caller cannot
# insert an address of its choosing in front of its real one.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Exports and PDF reports can take a while; uploads are buffered by Nginx first.
proxy_connect_timeout 5s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;

# API responses are never cached by the proxy or the browser unless the API says so.
proxy_no_cache 1;
proxy_cache_bypass 1;

add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
