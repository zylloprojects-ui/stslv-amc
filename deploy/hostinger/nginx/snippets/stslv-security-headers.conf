# STSLV AMC — security headers for the web application. TEMPLATE.
# Install as /etc/nginx/snippets/stslv-security-headers.conf.
#
# Included inside every location that serves the web application. Nginx drops server-level add_header
# lines in any location that has its own add_header, so these are included per location on purpose.
#
# Content-Security-Policy, reviewed against the web application at commit c6d8d19:
#   script-src   the bundle is served from this origin; index.html has ONE inline script (applies the saved
#                theme before paint), allowed by its sha256 hash only. The hash below is for stslv-web/index.html
#                at c6d8d19 (unchanged on this branch) BUILT WITH LF LINE ENDINGS, as on the Linux server.
#                (Corrected at the final integration, 2026-11-09: the earlier value was taken from a Windows
#                checkout with CRLF endings and would not have matched a build on the VPS.) Recompute ON THE SERVER
#                after every web build with deploy/hostinger/scripts/csp-hash.sh; a stale hash only loses the
#                theme-before-paint, nothing else.
#   style-src    'unsafe-inline' is kept because the application sets inline style attributes (gradients,
#                widths). No inline script is allowed, so this does not open script injection.
#   img-src      data: and blob: for generated images and file previews.
#   connect-src  'self': the API is reached on the same origin under /api. If the API is ever moved to its own
#                host name, add exactly that origin here.
#   object-src   'none'. PDF service reports open in a new tab from a blob: address; that tab inherits this
#                policy. Verify "open service report" in UAT (README checklist). If the browser refuses to show
#                the PDF, change object-src to 'self' blob: and nothing else.
#   frame-ancestors 'none': the application may not be framed (also X-Frame-Options DENY).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ZH6LvSQfR9fpRLgxEazOGMUEtxhV//sS8KEzaLPPHSA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# One year. includeSubDomains / preload are NOT set: add them only after confirming that every
# sub-domain of the confirmed domain is served over HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
